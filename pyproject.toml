[project]
name = "locklyctl"
version = "0.1.0"
description = "Unofficial command-line tool for Lockly smart locks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28", "pycryptodome>=3.17", "paho-mqtt>=1.6"]

[project.optional-dependencies]
keyring = ["keyring>=24"]   # keep the saved login in the OS keyring
# Desktop GUI. Windows/macOS use the built-in web view; on Linux the Qt
# backend installs from wheels, so it works in a plain virtualenv.
gui = ["pywebview>=5; sys_platform != 'linux'", "pywebview[qt]>=5; sys_platform == 'linux'"]
dev = ["pytest>=7"]

[project.scripts]
locklyctl = "locklyctl.cli:main"

[project.gui-scripts]
locklyctl-gui = "locklyctl.gui.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["locklyctl", "locklyctl.gui"]

[tool.setuptools.package-data]
locklyctl = ["certs/*"]
"locklyctl.gui" = ["web/*", "web/fonts/*"]
