[project]
name = "locklyctl"
version = "0.3.0"
description = "Unofficial computer, phone and AI-assistant control for Lockly smart locks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.LocklyHA", "NOTICE"]
# pycryptodome has no iOS build; there locklyctl uses its pure-Python ciphers.
dependencies = ["requests>=2.28", "pycryptodome>=3.17; sys_platform != 'ios'", "paho-mqtt>=1.6"]

[project.optional-dependencies]
keyring = ["keyring>=24"]   # keep the saved login in the OS keyring
# Desktop GUI. Windows/macOS use the built-in web view; on Linux the Qt
# backend installs from wheels, so it works in a plain virtualenv. 5.3 is the
# first pywebview whose start() takes icon=.
gui = ["pywebview>=5.3; sys_platform != 'linux'", "pywebview[qt]>=5.3; sys_platform == 'linux'"]
mcp = ["mcp>=1.2"]          # locklyctl-mcp, for AI assistants
bluetooth = ["bleak>=1.0"]  # talk to a lock next to this computer directly (locklyctl/ble.py)
dev = ["pytest>=7", "mcp>=1.2"]

[project.scripts]
locklyctl = "locklyctl.cli:main"
locklyctl-mcp = "locklyctl.mcp_server:main"

[project.gui-scripts]
locklyctl-gui = "locklyctl.gui.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["locklyctl", "locklyctl.gui"]

[tool.setuptools.package-data]
locklyctl = ["certs/*"]
"locklyctl.gui" = ["web/*", "web/fonts/*"]

# ── Phone apps (BeeWare Briefcase) ─────────────────────────────────────────
# The Android and iOS apps run the desktop app's page in a native web view,
# talking to the same Python code through locklyctl/gui/server.py. Android
# gets pycryptodome from Chaquopy; iOS uses the pure-Python cipher fallback.
#   briefcase build android && briefcase run android     (see mobile/README.md)
[tool.briefcase]
project_name = "locklyctl"
bundle = "com.digitalcybersoft"
url = "https://github.com/DigitalCyberSoft/locklyctl"
author = "DigitalCyberSoft"

[tool.briefcase.app.locklyctl_app]
formal_name = "locklyctl"
description = "Run your Lockly doors from your phone"
long_description = "Unofficial app for Lockly smart locks: check and lock doors, and manage who can get in."
sources = ["locklyctl", "mobile/locklyctl_app"]
icon = "mobile/icons/locklyctl"
requires = ["requests>=2.28", "paho-mqtt>=1.6"]

[tool.briefcase.app.locklyctl_app.iOS]
requires = ["toga-iOS~=0.5.7"]
# The page talks to Python on http://127.0.0.1; allow that, and only that.
info."NSAppTransportSecurity" = { NSAllowsLocalNetworking = true }

[tool.briefcase.app.locklyctl_app.android]
requires = ["toga-android~=0.5.7"]
base_theme = "Theme.MaterialComponents.Light.DarkActionBar"
build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    "androidx.webkit:webkit:1.15.0",
]
build_gradle_extra_content = """
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
"""
