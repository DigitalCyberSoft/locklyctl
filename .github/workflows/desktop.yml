# Builds the desktop app for Windows and macOS (Apple silicon) with PyInstaller.
# Run it from the Actions tab, or push a tag like v0.2.0 to also attach the
# builds to a GitHub release. Builds are unsigned.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: locklyctl-windows.zip
          - os: macos-latest
            asset: locklyctl-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui,keyring,dev]" pyinstaller
      - name: Test
        run: python -m pytest -q tests
      - name: Build
        run: pyinstaller --noconfirm packaging/locklyctl-gui.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/locklyctl -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/locklyctl.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes "Unsigned builds. macOS: right-click locklyctl.app and choose Open the first time. Windows: if SmartScreen warns, choose More info, then Run anyway."
